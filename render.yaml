services:
  # 1. Audio Originality Service
  - type: web
    name: drm-audio-engine
    env: docker
    dockerContext: originality-engine
    dockerfilePath: originality-engine/audioFiles/Dockerfile
    plan: free
    healthCheckPath: /health

  # 2. Image Originality Service
  - type: web
    name: drm-image-engine
    env: docker
    dockerContext: originality-engine
    dockerfilePath: originality-engine/imageFiles/Dockerfile
    plan: free
    healthCheckPath: /health

  # 3. Text Originality Service
  - type: web
    name: drm-text-engine
    env: docker
    dockerContext: originality-engine
    dockerfilePath: originality-engine/textFiles/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENABLE_SEMANTIC_CHECK
        value: "true"

  # 4. Video Originality Service
  - type: web
    name: drm-video-engine
    env: docker
    dockerContext: originality-engine
    dockerfilePath: originality-engine/videoFiles/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AUDIO_ENGINE_URL
        fromService:
          name: drm-audio-engine
          type: web
          property: host
      - key: IMAGE_ENGINE_URL
        fromService:
          name: drm-image-engine
          type: web
          property: host

  # 5. Main Backend Service
  - type: web
    name: drm-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000   # Render default port

      # Secrets → add manually in Render dashboard
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_KEY
        sync: false

      # Engine URLs (auto linked)
      - key: ENGINE_IMAGE_URL
        fromService:
          name: drm-image-engine
          type: web
          property: host

      - key: ENGINE_VIDEO_URL
        fromService:
          name: drm-video-engine
          type: web
          property: host

      - key: ENGINE_AUDIO_URL
        value: https://drm-audio-engine-obls.onrender.com

      - key: ENGINE_TEXT_URL
        fromService:
          name: drm-text-engine
          type: web
          property: host