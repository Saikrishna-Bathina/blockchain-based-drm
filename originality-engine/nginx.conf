events {}

http {
    client_max_body_size 100M;  # Allow large file uploads (video/audio)

    server {
        listen __PORT__;

        # Audio Service (Go)
        location /audio/ {
            rewrite ^/audio/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Image Service (Python)
        location /image/ {
            rewrite ^/image/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Text Service (Python)
        location /text/ {
            rewrite ^/text/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Video Service (Python)
        location /video/ {
            rewrite ^/video/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s; # Long timeout for video processing
        }
    }
}
